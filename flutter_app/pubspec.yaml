name: keepit
description: "KeepIt - AI Powered Second Brain & Smart Visual Bookmarks"
publish_to: "none"
version: 1.0.3+6

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & DI
  flutter_riverpod: ^2.5.1
  
  # Local-First Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # UI & Animations
  flutter_staggered_grid_view: ^0.7.0
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  flutter_animate: ^4.5.0
  # Local copy (vendor/lucide_icons): the published 0.257.0 release extends
  # IconData, which is a final class in current Flutter and fails to compile.
  lucide_icons:
    path: vendor/lucide_icons
  
  # Deep Link, Share Intent & Image Upload
  receive_sharing_intent: ^1.4.5
  image_picker: ^1.1.2
  url_launcher: ^6.2.6
  
  # Metadata Extraction
  http: ^1.2.1
  html: ^0.15.4
  uuid: ^4.4.0
  intl: ^0.19.0

  # Monetization (ads)
  google_mobile_ads: ^9.1.0

  # Firebase Sync & Push Notifications
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.4
  path_provider: ^2.1.5
  google_sign_in: ^7.2.0
  package_info_plus: ^10.2.1
  share_plus: ^13.3.0

  # Loads local config from .env (git-ignored): IMGBB_API_KEY etc.
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true

  assets:
    - assets/onboarding/
    - .env
