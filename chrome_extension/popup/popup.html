<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KeepIt Quick Save</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      width: 340px;
      padding: 16px;
      background: #F9F9FB;
      color: #1E212D;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 16px;
    }
    .logo-badge {
      width: 26px;
      height: 26px;
      background: #FF5B37;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 14px;
    }
    .card-preview {
      background: #FFFFFF;
      border: 1px solid #EBECEF;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }
    .page-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
      line-height: 1.3;
      max-height: 38px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .page-url {
      font-size: 11px;
      color: #7A7E8C;
      word-break: break-all;
    }
    .input-group {
      margin-bottom: 12px;
    }
    label {
      font-size: 11px;
      font-weight: 600;
      color: #7A7E8C;
      display: block;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input[type="text"] {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #EBECEF;
      border-radius: 10px;
      font-size: 13px;
      background: #FFFFFF;
      outline: none;
      transition: border 0.2s;
    }
    input[type="text"]:focus {
      border-color: #FF5B37;
    }
    .tag-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }
    .tag-chip {
      background: #F1F2F6;
      color: #4A4E5A;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      cursor: pointer;
    }
    .tag-chip.active {
      background: #FFECE7;
      color: #FF5B37;
      font-weight: 600;
    }
    .btn-save {
      width: 100%;
      padding: 11px;
      background: #FF5B37;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 10px rgba(255, 91, 55, 0.25);
      transition: opacity 0.2s;
    }
    .btn-save:hover {
      opacity: 0.92;
    }
    .cloud-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 14px;
      padding: 8px 10px;
      background: #FFF7F4;
      border: 1px solid #FFE3DB;
      border-radius: 10px;
    }
    .cloud-status {
      color: #7A4B3E;
      font-size: 10px;
      line-height: 1.25;
    }
    .cloud-actions {
      display: flex;
      gap: 5px;
      flex-shrink: 0;
    }
    .cloud-btn {
      border: 1px solid #FFB9A8;
      border-radius: 7px;
      background: white;
      color: #D94B2B;
      font-size: 10px;
      padding: 5px 7px;
      cursor: pointer;
    }
    .cloud-btn:disabled, .btn-save:disabled {
      opacity: 0.55;
      cursor: wait;
    }
    .desktop-send {
      margin-top: 12px;
      padding-top: 11px;
      border-top: 1px solid #EBECEF;
    }
    .desktop-label {
      margin-bottom: 7px;
      color: #7A7E8C;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .4px;
      text-transform: uppercase;
    }
    .desktop-buttons { display: flex; gap: 7px; }
    .desktop-btn {
      flex: 1;
      padding: 9px 6px;
      border: 1px solid #DCDDE3;
      border-radius: 9px;
      background: white;
      color: #444957;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .desktop-btn:hover { border-color: #FF9C82; color: #D94B2B; }
    .desktop-btn:disabled { opacity: .55; cursor: wait; }
    .status-msg {
      margin-top: 10px;
      text-align: center;
      font-size: 12px;
      color: #10B981;
      font-weight: 600;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="logo-badge">🧠</div>
      <span>KeepIt</span>
    </div>
  </div>

  <div class="card-preview">
    <div id="pageTitle" class="page-title">Loading current page...</div>
    <div id="pageUrl" class="page-url"></div>
  </div>

  <div class="cloud-row">
    <div id="cloudStatus" class="cloud-status">Checking cloud sync...</div>
    <div class="cloud-actions">
      <button id="connectBtn" class="cloud-btn" type="button">Connect</button>
      <button id="syncBtn" class="cloud-btn" type="button" style="display:none">Sync</button>
    </div>
  </div>

  <div class="input-group">
    <label>Tags (comma separated)</label>
    <input type="text" id="tagsInput" placeholder="inspiration, dev, read-later" />
    <div class="tag-container" id="suggestedTags">
      <span class="tag-chip active">#ideas</span>
      <span class="tag-chip active">#research</span>
      <span class="tag-chip">#bookmark</span>
      <span class="tag-chip">#reels</span>
    </div>
  </div>

  <button class="btn-save" id="saveBtn">
    <span>Save to Mind</span>
  </button>
  <section class="desktop-send" aria-label="Send to KeepIt desktop">
    <div class="desktop-label">KeepIt Desktop</div>
    <div class="desktop-buttons">
      <button class="desktop-btn" id="sendPageBtn" type="button">Send this page</button>
      <button class="desktop-btn" id="sendSelectionBtn" type="button">Send selection</button>
    </div>
  </section>
  <div class="status-msg" id="statusMsg" aria-live="polite">Ready to save.</div>

  <script src="popup.js"></script>
</body>
</html>
