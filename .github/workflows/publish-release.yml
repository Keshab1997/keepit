name: Publish Android Release

# Actions → Publish Android Release → Run workflow.
# Builds a signed APK + AAB, tags v<pubspec version-name>, writes English
# release notes from the commit titles since the previous tag, publishes the
# GitHub Release and uploads the versioned APK/AAB plus SHA256SUMS.txt.
#
# Uploading to Google Play is opt-in per run: set "Upload to Play internal
# testing" to true when dispatching. It reuses this same signed AAB — no second
# build — and lands on the `internal` track only, never production. Needs the
# PLAY_SERVICE_ACCOUNT_JSON secret and the package name typed exactly as in
# Play Console (com.keshabstudios.keepit). Play rejects a version code it has
# already seen, so bump the +build number in pubspec.yaml before every upload.
#
# Bump flutter_app/pubspec.yaml (version: 1.0.1+2) in a PR before running this.
# Needs the keystore secrets in this repository's Settings → Secrets.

on:
  workflow_dispatch:
    inputs:
      draft:
        description: Create the GitHub Release as a draft?
        required: false
        type: boolean
        default: false
      prerelease:
        description: Mark this as a prerelease?
        required: false
        type: boolean
        default: false
      upload_to_play_internal:
        description: Also upload the signed AAB to Google Play Internal testing?
        required: false
        type: boolean
        default: false
      package_name:
        description: Android applicationId / Play Console package name (required if Play upload is enabled)
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish:
    uses: Keshab1997/flutter-builder/.github/workflows/publish-release.yml@v1.13.1
    with:
      app-name: KeepIt
      working-directory: flutter_app
      release-draft: ${{ inputs.draft }}
      release-prerelease: ${{ inputs.prerelease }}
      # Play upload, opt-in per run. An empty play-track is what switches the
      # AAB upload off inside the reusable build (flutter-build.yml skips the
      # step when play-track is blank), so the default dispatch behaves exactly
      # as before: GitHub Release only.
      play-track: ${{ inputs.upload_to_play_internal && 'internal' || '' }}
      play-package-name: ${{ inputs.package_name }}
      # Per-release "What's new" text for Play, one file per locale:
      # distribution/whatsnew/whatsnew-en-US, whatsnew-bn-BD. Update them in the
      # same commit as the version bump, or Play shows the previous release's
      # notes.
      play-whats-new-directory: ${{ inputs.upload_to_play_internal && 'distribution/whatsnew' || '' }}
      # completed = published to internal testers straight away; production is
      # never touched by this workflow.
      play-status: completed
      # Real AdMob IDs come from repository Variables, never from git. A
      # reusable workflow's `with:` inputs cannot read the secrets context, and
      # AdMob IDs are public identifiers that ship inside every APK anyway.
      # Without them the app compiles ad-free (AdConfig.adsEnabled is false).
      dart-defines: |
        ADMOB_ENABLED=true
        ADMOB_APP_ID=${{ vars.ADMOB_APP_ID }}
        ADMOB_BANNER_ID=${{ vars.ADMOB_BANNER_ID }}
        ADMOB_INTERSTITIAL_ID=${{ vars.ADMOB_INTERSTITIAL_ID }}
        ADMOB_REWARDED_ID=${{ vars.ADMOB_REWARDED_ID }}
      # Gradle reads this for the AndroidManifest AdMob app ID placeholder.
      build-env: |
        ADMOB_APP_ID=${{ vars.ADMOB_APP_ID }}
      # google-services.json is read from the GOOGLE_SERVICES_JSON_BASE64
      # secret inside the builder (v1.6.0+) and written to
      # flutter_app/android/app/ before the build. `secrets: inherit` below
      # passes it through. A missing secret means an offline-only build.
      #
      # Pre-flight (v1.7.0+): doctor.sh runs right before the artifact is
      # built. With preflight-require-firebase, an EMPTY
      # GOOGLE_SERVICES_JSON_BASE64 fails the release loudly instead of
      # silently shipping an app with no cloud sync.
      preflight: true
      preflight-require-firebase: true
      # A release is exactly the build you do not want to ship red, so the
      # release path runs the same gates as ci.yml instead of trusting that CI
      # already passed on the branch.
      run-analyze: true
      run-tests: true
      # ci.yml caps artifacts at 150 MB; keep the release under the same limit.
      max-artifact-size-mb: 150
      artifact-retention-days: 30
    # GOOGLE_SERVICES_JSON_BASE64 (and the iOS plist equivalent) are injected by
    # the builder, so `secrets: inherit` passes them without naming each one.
    secrets: inherit
