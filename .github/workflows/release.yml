name: Android Release

# Optional: pushing a tag (git tag v1.0.1 && git push origin v1.0.1) builds a
# signed AAB artifact. It does not publish a GitHub Release — use
# Publish Android Release for that. Needs the keystore secrets.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-aab:
    uses: Keshab1997/flutter-builder/.github/workflows/flutter-build.yml@v1.7.0
    with:
      flutter-channel: stable
      working-directory: flutter_app
      build-apk: false
      build-aab: true
      artifact-retention-days: 30
      dart-defines: |
        ADMOB_ENABLED=true
        ADMOB_APP_ID=${{ vars.ADMOB_APP_ID }}
        ADMOB_BANNER_ID=${{ vars.ADMOB_BANNER_ID }}
        ADMOB_INTERSTITIAL_ID=${{ vars.ADMOB_INTERSTITIAL_ID }}
        ADMOB_REWARDED_ID=${{ vars.ADMOB_REWARDED_ID }}
      build-env: |
        ADMOB_APP_ID=${{ vars.ADMOB_APP_ID }}
      # Pre-flight (v1.7.0+): a tagged build should never ship with a broken
      # or empty Firebase config.
      preflight: true
      preflight-require-firebase: true
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
