name: keepit
description: "KeepIt - AI Powered Second Brain & Smart Visual Bookmarks"
publish_to: "none"
version: 1.0.13+17

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Material lives in its own package from Flutter 3.47 on: importing
  # package:flutter/material.dart is deprecated and CI analyzes with
  # --fatal-infos, so the app imports this directly.
  material_ui: ^1.11.1

  # Grapheme-aware truncation (metadata captions, notification text): a plain
  # substring can split an emoji's surrogate pair and throw.
  characters: ^1.4.1
  
  # State Management & DI
  flutter_riverpod: ^3.5.0
  
  # Local-First Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # UI & Animations
  flutter_staggered_grid_view: ^0.7.0
  google_fonts: ^9.0.0
  cached_network_image: ^4.0.0
  flutter_animate: ^4.5.0
  # Local copy (vendor/lucide_icons): the published 0.257.0 release extends
  # IconData, which is a final class in current Flutter and fails to compile.
  lucide_icons:
    path: vendor/lucide_icons
  
  # Deep Link, Share Intent & Image Upload
  receive_sharing_intent: ^1.4.5
  image_picker: ^1.1.2
  url_launcher: ^6.2.6
  
  # Metadata Extraction
  http: ^1.2.1
  html: ^0.15.4
  uuid: ^4.4.0
  intl: ^0.20.3

  # Monetization (ads)
  google_mobile_ads: ^9.1.0

  # Firebase Sync & Push Notifications
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  flutter_local_notifications: ^23.0.2
  timezone: ^0.11.2

  # The device's IANA zone name (Asia/Kolkata), so reminders fire at the
  # user's chosen wall-clock time across DST changes and travel.
  flutter_timezone: ^5.1.1
  path_provider: ^2.1.5
  google_sign_in: ^7.2.0
  package_info_plus: ^10.2.1
  share_plus: ^13.3.0

  # Loads local config from .env (git-ignored): IMGBB_API_KEY etc.
  flutter_dotenv: ^5.1.0

  # In-app updates: asks Google Play whether a newer build of KeepIt exists and
  # downloads/installs it without leaving the app. Android-only at runtime.
  in_app_update: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true

  assets:
    - assets/onboarding/
    - .env
